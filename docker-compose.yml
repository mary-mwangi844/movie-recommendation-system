version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: movie_db
    environment:
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_password
      POSTGRES_DB: movie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - movie_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: movie_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@movie.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - movie_network

volumes:
  postgres_data:

networks:
  movie_network:
    driver: bridge
